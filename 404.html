<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404｜AI Chief of Staff Lab.</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #FFF9EE;
    font-family: 'Noto Sans JP', sans-serif;
    color: #2A2419;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .container { max-width: 520px; }
  .num {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 900;
    font-size: 160px;
    color: #FF8C42;
    line-height: 1;
    text-shadow: 8px 8px 0 #FFD84D;
    margin-bottom: 24px;
  }
  h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 32px;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  p { color: #4D5862; margin-bottom: 32px; }
  .btn {
    display: inline-block;
    background: #2A2419;
    color: white;
    padding: 16px 40px;
    border-radius: 100px;
    text-decoration: none;
    font-weight: 700;
    border: 3px solid #2A2419;
    box-shadow: 4px 4px 0 #FF8C42;
    transition: transform 0.15s;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
  <div class="container">
    <div class="num">404</div>
    <h1>お探しのページが見つかりません</h1>
    <p>URLが間違っているか、ページが移動した可能性があります。</p>
    <a href="/" class="btn">トップへ戻る →</a>
  </div>
</body>
</html>
