<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メイン画像｜ココナラ／ランサーズ サムネイル</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    font-family: 'Noto Sans JP', sans-serif;
  }

  /* ========== ココナラ用 1080x720 (3:2) ========== */
  .thumb {
    width: 1080px;
    height: 720px;
    background: linear-gradient(135deg, #FFE9B8 0%, #FFF9EE 100%);
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .thumb::before {
    content: "";
    position: absolute;
    top: -100px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255, 140, 66, 0.18) 0%, transparent 70%);
    border-radius: 50%;
  }

  .thumb::after {
    content: "";
    position: absolute;
    bottom: -150px;
    left: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255, 216, 77, 0.25) 0%, transparent 70%);
    border-radius: 50%;
  }

  .badge {
    position: absolute;
    top: 40px;
    left: 40px;
    background: #2A2419;
    color: #FFD84D;
    padding: 12px 28px;
    border-radius: 100px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.05em;
    z-index: 2;
    border: 3px solid #2A2419;
  }
  .badge::before { content: "🎯 "; }

  .price-tag {
    position: absolute;
    top: 40px;
    right: 40px;
    background: #FF8C42;
    color: white;
    padding: 16px 32px;
    border-radius: 100px;
    font-size: 28px;
    font-weight: 900;
    border: 3px solid #2A2419;
    box-shadow: 4px 4px 0 #2A2419;
    z-index: 2;
    transform: rotate(3deg);
  }

  .main-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 3;
    width: 90%;
  }

  .main-text h1 {
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 110px;
    font-weight: 900;
    line-height: 1.15;
    color: #2A2419;
    text-shadow: 6px 6px 0 #FFD84D;
    letter-spacing: -0.01em;
    margin-bottom: 24px;
  }

  .main-text h1 .highlight {
    color: #E5701F;
    background: linear-gradient(180deg, transparent 60%, #FFE585 60%);
    padding: 0 12px;
  }

  .main-text .subtitle {
    font-size: 32px;
    font-weight: 700;
    color: #4D5862;
    margin-top: 32px;
    line-height: 1.6;
  }

  .footer-info {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 3px solid #2A2419;
    border-radius: 100px;
    padding: 14px 36px;
    font-size: 20px;
    font-weight: 700;
    color: #2A2419;
    box-shadow: 4px 4px 0 #2A2419;
    z-index: 2;
    text-align: center;
    white-space: nowrap;
  }

  .footer-info .icon { color: #FF8C42; margin: 0 8px; }

  /* チェックバッジ */
  .check-badges {
    position: absolute;
    top: 480px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 2;
  }
  .check-badge {
    background: white;
    border: 2px solid #2A2419;
    border-radius: 100px;
    padding: 8px 18px;
    font-size: 16px;
    font-weight: 700;
    color: #2A2419;
  }
  .check-badge::before { content: "✓ "; color: #5CB85C; font-weight: 900; }

  /* ====== Print/Export用 ====== */
  @media print {
    body { padding: 0; background: white; }
    .thumb { box-shadow: none; }
  }

  /* ====== サイズ別バリエーション ====== */
  /* ランサーズ用 1280x720 (16:9) は別ファイル */
</style>
</head>
<body>

<div class="thumb">
  <div class="badge">経営者・個人事業主向け</div>
  <div class="price-tag">¥30,000 / 2時間</div>

  <div class="main-text">
    <h1>
      <span class="highlight">月30時間</span>を、<br>
      AIで取り戻す。
    </h1>
    <p class="subtitle">
      Claude Code 個別レクチャー｜マンツーマンZoom
    </p>
  </div>

  <div class="check-badges">
    <div class="check-badge">プログラミング知識ゼロOK</div>
    <div class="check-badge">2時間で実装完了</div>
    <div class="check-badge">録画＋30日サポート付</div>
  </div>

  <div class="footer-info">
    <span class="icon">🎤</span>講師：桜木 健二｜東京大学大学院 近山・田浦研究室 卒業<span class="icon">🎤</span>
  </div>
</div>

<div style="margin-top: 40px; color: white; text-align: center; font-size: 14px; line-height: 1.8;">
  <p>📐 サイズ：1080 × 720px（ココナラ標準）</p>
  <p>📸 スクリーンショット手順：このページを開いて、Macなら ⌘+Shift+4 で範囲選択 / Windowsなら Snipping Tool で枠を選択</p>
  <p>または、ブラウザの「PDFに保存」→ 該当ページをスクリーンショット</p>
</div>

</body>
</html>
